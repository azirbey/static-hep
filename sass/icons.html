<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>HEP icons</title>
	<style>
		:root {
			--cyan: #0febff;
			--white: #ffffff;
			--gray: #bccbdc;
			--bg: #f4f6f8;
			--panel: #ffffff;
			--text: #1c2835;
			--muted: #64748b;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
			background: var(--bg);
			color: var(--text);
		}
		header {
			padding: 16px 24px;
			background: #fff;
			border-bottom: 1px solid #dce3ea;
		}
		h1 { margin: 0 0 4px; font-size: 18px; color: var(--text); }
		p { margin: 0; color: var(--muted); }
		h2 {
			margin: 0 0 12px;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: .06em;
			color: var(--text);
		}
		.columns {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 16px;
			align-items: start;
			padding: 24px;
		}
		.col {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.col > div {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.card {
			background: var(--panel);
			border: 1px solid #dce3ea;
			border-radius: 8px;
			padding: 14px 10px 10px;
			text-align: center;
		}
		.row { display: flex; justify-content: center; gap: 10px; }
		.swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; }
		.swatch label { font-size: 9px; color: var(--muted); }
		.chip {
			border-radius: 6px;
			padding: 6px;
			background: #eef2f6;
		}
		.chip.white { background: #1c2835; }
		.chip svg {
			width: 24px;
			height: 24px;
			display: block;
		}
		.card img {
			width: 32px;
			height: 32px;
			display: block;
			margin: 0 auto 8px;
		}
		.name { margin-top: 8px; font-size: 11px; color: var(--muted); word-break: break-all; }
	</style>
</head>
<body>
	<header>
		<h1>İkon galerisi</h1>
		<p>Nav / UI: aynı SVG, currentColor ile cyan / white / gray. Sports / flags: orijinal renk.</p>
	</header>
	<div class="columns">
		<section class="col">
			<h2>Nav</h2>
			<div id="nav"></div>
		</section>
		<section class="col">
			<h2>UI</h2>
			<div id="ui"></div>
		</section>
		<section class="col">
			<h2>Sports</h2>
			<div id="sports"></div>
		</section>
		<section class="col">
			<h2>Flags</h2>
			<div id="flags"></div>
		</section>
	</div>
	<script>
		const groups = {
			nav: [
				"canli-bahis","spor","casino","canli-casino","vip-slot","crash-oyunlar",
				"aviator","ozel-oran","sanal-sporlar","e-sporlar","tv-oyunlari","hep-tv",
				"hep-market","kupon-savaslari","ortaklik","promosyonlar","hepbet-iptv"
			],
			ui: [
				"star","search","calendar","clock","stopwatch","scoreboard","more","menu",
				"padlock","gift-box","call-back","diamond","headset","whatsapp","telegram",
				"wallet","column-chart","trend","live-rtp"
			],
			sports: [
				"football","basketball-ball","tennis-balls","volleyball","ice-hockey",
				"handball","cricket","pickleball","dart","boxing-gloves","baseball-glove",
				"biathlon","globe"
			],
			flags: [
				"angola","argentina","australia","brazil","canada","england","estonia",
				"european-union","france","germany","india","italy","kazakhstan","lebanon",
				"malaysia","mexico","myanmar","netherlands","new-zealand","paraguay","peru",
				"portugal","south-korea","spain","tanzania","turkey","united-kingdom",
				"united-states","uruguay","uzbekistan","vietnam","world"
			]
		};

		const paints = [
			["cyan", "#0febff"],
			["white", "#ffffff"],
			["gray", "#bccbdc"]
		];

		let svgUid = 0;
		function uniquify(svg) {
			svgUid += 1;
			return svg
				.replace(/id="([^"]+)"/g, `id="$1_${svgUid}"`)
				.replace(/url\(#([^)]+)\)/g, `url(#$1_${svgUid})`);
		}

		async function loadSvg(path) {
			const res = await fetch(path);
			return uniquify(await res.text());
		}

		async function renderMono(group) {
			const root = document.getElementById(group);
			for (const name of groups[group]) {
				const svg = await loadSvg(`icons/${group}/${name}.svg`);
				const card = document.createElement("div");
				card.className = "card";
				card.innerHTML =
					`<div class="row">${paints.map(([label, hex]) => `
						<div class="swatch">
							<div class="chip ${label}" style="color:${hex}">${uniquify(svg)}</div>
							<label>${label}</label>
						</div>
					`).join("")}</div>
					<div class="name">${name}</div>`;
				root.appendChild(card);
			}
		}

		function renderColor(group) {
			const root = document.getElementById(group);
			groups[group].forEach((name) => {
				const card = document.createElement("div");
				card.className = "card";
				card.innerHTML =
					`<img src="icons/${group}/${name}.svg" alt="${name}" width="32" height="32">` +
					`<div class="name">${name}</div>`;
				root.appendChild(card);
			});
		}

		renderMono("nav");
		renderMono("ui");
		renderColor("sports");
		renderColor("flags");
	</script>
</body>
</html>
