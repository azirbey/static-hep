<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>Hepbet UI Notları</title>
		<link
			rel="stylesheet"
			href="style.css" />
		<script>
			try {
				if (localStorage.getItem("hep-ui-edit") === "1") {
					document.documentElement.classList.add("edit-enabled");
				}
				var savedView = localStorage.getItem("hep-ui-view");
				if (savedView === "done" || savedView === "archive") {
					document.documentElement.dataset.view = savedView;
				}
			} catch (err) {}
		</script>
	</head>
	<body>
		<div class="layout">
			<div class="col col-list">
				<div class="col-list-header-container">
					<div class="col-list-header-main">
						<div class="page-title">
							<span
								class="page-title-icon"
								aria-hidden="true">
								<span
									class="page-title-icon-item"
									data-view="open">
									<i
										data-lucide="clipboard"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
								<span
									class="page-title-icon-item"
									data-view="done">
									<i
										data-lucide="package"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
								<span
									class="page-title-icon-item"
									data-view="archive">
									<i
										data-lucide="archive"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
							</span>
							<h1>Hepbet UI Notları</h1>
						</div>
						<label
							class="edit-mode"
							aria-label="Düzenleme"
							title="Düzenleme">
							<input
								type="checkbox"
								id="edit-enabled"
								class="edit-switch-input" />
							<span
								class="edit-switch"
								aria-hidden="true">
								<span class="edit-switch-thumb">
									<i
										data-lucide="ban"
										class="icon icon--edit-off"
										aria-hidden="true"></i>
									<i
										data-lucide="pencil"
										class="icon icon--edit-on"
										aria-hidden="true"></i>
								</span>
							</span>
						</label>
					</div>
					<div class="col-list-header-actions">
						<div class="count-meta">
							<span
								id="count"
								class="count-badge"
								hidden></span>
							<button
								type="button"
								id="btn-archive-all"
								class="nav-btn nav-btn-dark"
								hidden>
								Arşive Taşı
							</button>
						</div>
						<div
							class="view-dropdown"
							id="view-dropdown">
							<button
								type="button"
								class="view-dropdown-trigger nav-btn"
								id="view-dropdown-trigger"
								aria-haspopup="listbox"
								aria-expanded="false"
								aria-controls="view-dropdown-menu">
								<span
									id="view-dropdown-label"
									class="view-dropdown-label">
									<span
										class="view-dropdown-label-item"
										data-view="open">
										<i
											data-lucide="clipboard"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Açık</span
										>
									</span>
									<span
										class="view-dropdown-label-item"
										data-view="done">
										<i
											data-lucide="package"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Tamamlanan</span
										>
									</span>
									<span
										class="view-dropdown-label-item"
										data-view="archive">
										<i
											data-lucide="archive"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Arşiv</span
										>
									</span>
								</span>
								<svg
									class="view-dropdown-icon"
									width="14"
									height="14"
									viewBox="0 0 24 24"
									fill="none"
									aria-hidden="true">
									<path
										d="M4 7H20M4 12H20M4 17H20"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round" />
								</svg>
							</button>
							<div
								class="view-dropdown-menu"
								id="view-dropdown-menu"
								role="listbox"
								aria-labelledby="view-dropdown-trigger"
								hidden>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="open"
									role="option"
									aria-selected="false">
									<i
										data-lucide="clipboard"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Açık</span>
								</button>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="done"
									role="option"
									aria-selected="false">
									<i
										data-lucide="package"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Tamamlanan</span>
								</button>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="archive"
									role="option"
									aria-selected="false">
									<i
										data-lucide="archive"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Arşiv</span>
								</button>
							</div>
						</div>
						<button
							type="button"
							id="btn-add"
							class="nav-btn add-button">
							<svg
								width="14"
								height="14"
								viewBox="0 0 24 24"
								fill="none"
								xmlns="http://www.w3.org/2000/svg">
								<path
									d="M12 5V19M5 12H19"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round" />
							</svg>
						</button>
					</div>
				</div>
				<div id="list"></div>
			</div>
			<div class="col col-add">
				<form id="form">
					<p class="hint">Yeni madde listenin en sonuna eklenir.</p>
					<textarea
						id="text"
						rows="8"
						required></textarea>
					<button type="submit">Ekle</button>
				</form>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
		<script src="app.js"></script>
	</body>
</html>
