<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>HepBet UI Notları</title>
		<link
			rel="stylesheet"
			href="style.css" />
		<script>
			try {
				if (
					localStorage.getItem("hep-ui-dev") === "1" &&
					localStorage.getItem("hep-ui-edit") === "1"
				) {
					document.documentElement.classList.add("edit-enabled");
				}
				var savedView = localStorage.getItem("hep-ui-view");
				if (savedView === "done" || savedView === "archive") {
					document.documentElement.dataset.view = savedView;
				}
				var addPanel = localStorage.getItem("hep-ui-add-panel");
				if (
					addPanel === "1" ||
					(addPanel !== "0" &&
						window.matchMedia("(min-width: 861px)").matches)
				) {
					document.documentElement.classList.add("add-panel-open");
				}
			} catch (err) {}
		</script>
	</head>
	<body>
		<div class="layout">
			<div class="col col-list">
				<div class="col-list-header-container">
					<div class="col-list-header-main">
						<button
							type="button"
							id="btn-page-title"
							class="page-title"
							aria-label="Açık listeye dön">
							<span
								class="page-title-icon"
								aria-hidden="true">
								<span
									class="page-title-icon-item"
									data-view="open">
									<i
										data-lucide="clipboard"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
								<span
									class="page-title-icon-item"
									data-view="done">
									<i
										data-lucide="package"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
								<span
									class="page-title-icon-item"
									data-view="archive">
									<i
										data-lucide="archive"
										class="icon icon--page-title"
										aria-hidden="true"></i>
								</span>
							</span>
							<span class="page-title-text">HepBet UI Notları</span>
						</button>
						<label
							class="edit-mode"
							aria-label="Düzenleme">
							<input
								type="checkbox"
								id="edit-enabled"
								class="edit-switch-input" />
							<span
								class="edit-switch"
								aria-hidden="true">
								<span class="edit-switch-thumb">
									<i
										data-lucide="ban"
										class="icon icon--edit-off"
										aria-hidden="true"></i>
									<i
										data-lucide="pencil"
										class="icon icon--edit-on"
										aria-hidden="true"></i>
								</span>
							</span>
						</label>
					</div>
					<div class="col-list-header-actions">
						<div class="count-meta">
							<span
								id="count"
								class="count-badge"
								hidden></span>
							<button
								type="button"
								id="btn-archive-all"
								class="nav-btn nav-btn-dark"
								hidden>
								Arşive Taşı
							</button>
						</div>
						<div
							class="view-dropdown"
							id="view-dropdown">
							<button
								type="button"
								class="view-dropdown-trigger nav-btn"
								id="view-dropdown-trigger"
								aria-haspopup="listbox"
								aria-expanded="false"
								aria-controls="view-dropdown-menu"
								aria-label="Görünüm seç">
								<span
									id="view-dropdown-label"
									class="view-dropdown-label">
									<span
										class="view-dropdown-label-item"
										data-view="open">
										<i
											data-lucide="clipboard"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Açık</span
										>
									</span>
									<span
										class="view-dropdown-label-item"
										data-view="done">
										<i
											data-lucide="package"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Tamamlanan</span
										>
									</span>
									<span
										class="view-dropdown-label-item"
										data-view="archive">
										<i
											data-lucide="archive"
											class="icon icon--view"
											aria-hidden="true"></i>
										<span class="view-dropdown-label-text"
											>Arşiv</span
										>
									</span>
								</span>
								<svg
									class="view-dropdown-icon"
									width="14"
									height="14"
									viewBox="0 0 24 24"
									fill="none"
									aria-hidden="true">
									<path
										d="M4 7H20M4 12H20M4 17H20"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round" />
								</svg>
							</button>
							<div
								class="view-dropdown-menu"
								id="view-dropdown-menu"
								role="listbox"
								aria-labelledby="view-dropdown-trigger"
								hidden>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="open"
									role="option"
									aria-selected="false">
									<i
										data-lucide="clipboard"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Açık</span>
								</button>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="done"
									role="option"
									aria-selected="false">
									<i
										data-lucide="package"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Tamamlanan</span>
								</button>
								<button
									type="button"
									class="view-dropdown-option"
									data-view="archive"
									role="option"
									aria-selected="false">
									<i
										data-lucide="archive"
										class="icon icon--view"
										aria-hidden="true"></i>
									<span>Arşiv</span>
								</button>
							</div>
						</div>
						<button
							type="button"
							id="btn-add"
							class="nav-btn add-button has-cta-pill"
							aria-label="Yeni madde paneli"
							aria-controls="col-add"
							aria-expanded="false">
							<i
								data-lucide="plus"
								class="icon icon--add-plus"
								aria-hidden="true"></i>
							<i
								data-lucide="eye"
								class="icon icon--add-eye"
								aria-hidden="true"></i>
							<span class="cta-pill" role="tooltip">Yeni madde</span>
						</button>
					</div>
				</div>
				<div id="list"></div>
			</div>
			<div
				class="col col-add"
				id="col-add">
				<div class="col-add-header">
					<h2 class="col-add-title">Yeni madde</h2>
					<button
						type="button"
						id="btn-add-close"
						class="btn-add-close has-cta-pill"
						aria-label="Ekle panelini gizle">
						<i
							data-lucide="eye-off"
							class="icon icon--add-hide"
							aria-hidden="true"></i>
						<span class="cta-pill" role="tooltip">Paneli gizle</span>
					</button>
				</div>
				<form id="form">
					<p class="hint">Listenin en sonuna eklenir.</p>
					<textarea
						id="text"
						rows="8"
						required></textarea>
					<button type="submit">Ekle</button>
				</form>
			</div>
		</div>
		<div
			id="author-modal"
			class="author-modal"
			hidden>
			<div
				class="author-modal-dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="author-modal-title">
				<form id="author-form">
					<h2 id="author-modal-title">İsminiz</h2>
					<p class="author-modal-hint">
						Cevaplarda görünecek adı girin. Bu tarayıcıda hatırlanır.
					</p>
					<input
						id="author-input"
						type="text"
						autocomplete="nickname"
						required
						placeholder="Adınız" />
					<div class="author-modal-actions">
						<button
							type="button"
							id="author-modal-cancel"
							class="author-modal-btn author-modal-btn-ghost">
							İptal
						</button>
						<button
							type="submit"
							id="author-modal-save"
							class="author-modal-btn author-modal-btn-primary">
							Kaydet
						</button>
					</div>
				</form>
			</div>
		</div>
		<div
			id="confirm-modal"
			class="author-modal confirm-modal"
			hidden>
			<div
				class="author-modal-dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="confirm-modal-title">
				<h2 id="confirm-modal-title">Onay</h2>
				<p
					id="confirm-modal-text"
					class="author-modal-hint">
					Emin misiniz?
				</p>
				<div class="author-modal-actions">
					<button
						type="button"
						id="confirm-modal-cancel"
						class="author-modal-btn author-modal-btn-ghost">
						Vazgeç
					</button>
					<button
						type="button"
						id="confirm-modal-ok"
						class="author-modal-btn author-modal-btn-danger">
						Sil
					</button>
				</div>
			</div>
		</div>
		<div
			id="image-modal"
			class="image-modal"
			hidden>
			<div
				class="image-modal-dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="image-modal-title">
				<div class="image-modal-header">
					<h2 id="image-modal-title">Görsel</h2>
					<button
						type="button"
						id="image-modal-close"
						class="image-modal-close"
						aria-label="Kapat">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							aria-hidden="true">
							<path
								d="M18 6L6 18M6 6L18 18"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round" />
						</svg>
					</button>
				</div>
				<div class="image-modal-body">
					<img
						id="image-modal-img"
						alt="" />
				</div>
				<div class="image-modal-actions">
					<a
						id="image-modal-full"
						class="author-modal-btn author-modal-btn-primary"
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						>Tam boy gör</a
					>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
		<script src="app.js"></script>
	</body>
</html>
